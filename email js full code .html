<!doctype html>
<html lang="en">

<head>
    <title>JK Global IT Solutions</title>
    <link rel="icon" type="image/x-icon" href="./images/fevicol.png">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function () {
            emailjs.init("iNHDPovnY3uE4xcFq");
        })();
    </script>
</head>

<body style="align-items: center;">
    <main>
        <div class="contact">
            <div class="container">
                <div class="row">
                    <div class="col-md-12">
                        <form class="main_form" id="myForm">
                            <div class="row">
                                <div class="col-12 col-lg-6">
                                    <div class="mb-3 d-flex row">
                                      <div class="col-12 col-lg-3">
                                        <label for="name" class="form-label px-4">Name</label>
                                      </div>
                                      <div class="col-12 col-lg-9">
                                        <input type="text" class="form-control border-danger shadow" id="name"
                                        name="Your Name" aria-describedby="emailHelp">
                                      </div>
                                    </div>
                                    <div class="mb-3 d-flex row">
                                      <div class="col-12 col-lg-3">
                                        <label for="email" class="form-label px-4">Email Id</label>
                                      </div>
                                      <div class="col-12 col-lg-9">
                                        <input type="email" class="form-control border-danger shadow" name="Email"
                                        id="email" aria-describedby="emailHelp">
                                      </div>
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <button class="send rounded-pill" type="submit">Send</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
        integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
        crossorigin="anonymous"></script>
    <script>
        document.getElementById("myForm").addEventListener("submit", function (event) {
            event.preventDefault(); // Prevent default form submission
            sendEmail(); // Call the function to send email
            sendWhatsAppMessage(); // Call the function to send WhatsApp message
        });

        function sendEmail() {
            var name = document.getElementById("name").value;
            var email = document.getElementById("email").value;

            var templateParams = {
                name: name,
                email: email
            };

            emailjs.send("service_nyyw4bk", "template_qxyf97h", templateParams)
                .then(function (response) {
                    console.log("SUCCESS!", response.status, response.text);
                    window.alert("Sent successfully!");
                }, function(error) {
                    console.error("FAILED...", error);
                    window.alert("Failed to send. Please try again.");
                });
        }

        function sendWhatsAppMessage() {
            var name = encodeURIComponent(document.getElementById("name").value);
            var email = encodeURIComponent(document.getElementById("email").value);

            var message = `*Contact Form Submission*%0A%0A` +
                `*Name:* ${name}%0A` +
                `*Email ID:* ${email}%0A`;

            var whatsappUrl = `https://api.whatsapp.com/send?phone=9894924809&text=${message}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>

</html>
