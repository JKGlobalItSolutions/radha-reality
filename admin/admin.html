<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radha Realty Admin</title>
  <link href="../assets/img/favicon.JPG" rel="icon">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    body {
      background-color: #f8f9fa;
    }

    .navbar {
      background-color: #2ec96a;
    }

    .navbar-brand,
    .nav-link,
    .navbar-toggler-icon {
      color: white !important;
    }

    .navbar-brand {
      font-weight: bold;
    }

    .container h2 {
      color: #2ec96a;
    }

    .btn-primary {
      background-color: #2ec96a;
      border-color: #2ec96a;
    }

    .btn-primary:hover {
      background-color: #2ec96a;
      border-color: #2ec96a;
    }

    .btn-danger {
      background-color: #dc3545;
      border-color: #dc3545;
    }

    .btn-danger:hover {
      background-color: #c82333;
      border-color: #bd2130;
    }

    .form-control:focus {
      border-color: #2ec96a;
      box-shadow: none;
    }

    .table thead th {
      background-color: #2ec96a;
      color: white;
    }

    .form-group label[for="fileInput"] {
      color: #b6a68b;
      cursor: pointer;
    }

    #uploadForm {
      text-align: center;
    }

    #uploadForm .form-group {
      display: inline-block;
      width: 100%;
      max-width: 400px;
    }

    #uploadForm .btn-primary {
      width: 100%;
      max-width: 400px;
    }

    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1050;
    }
  </style>
  <!-- Firebase Configuration -->
  <script type="module">
    // Firebase configuration and functions
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-analytics.js";
    import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-storage.js";
    import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA0QZ3-v29eEelAfhlha5RHJZBuJ6mekes",
      authDomain: "radha-realty-99472.firebaseapp.com",
      projectId: "radha-realty-99472",
      storageBucket: "radha-realty-99472.appspot.com",
      messagingSenderId: "125909486002",
      appId: "1:125909486002:web:bbcdefb22a1922ea843cab",
      measurementId: "G-JNV02788XZ"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const storage = getStorage(app);
    const firestore = getFirestore(app);
    const auth = getAuth(app);

    document.addEventListener('DOMContentLoaded', () => {
      onAuthStateChanged(auth, (user) => {
        if (!user) {
          window.location.href = 'login.html'; // Redirect to login page if not authenticated
          return;
        }

        // Function to calculate remaining plots
        const calculateRemainingPlots = (total, sold) => {
          return Math.max(0, total - sold);
        };

        // Add event listeners for total and sold plots inputs
        ['totalPlots', 'soldPlots', 'editTotalPlots', 'editSoldPlots'].forEach(id => {
          document.getElementById(id).addEventListener('input', function() {
            const form = this.closest('form');
            const total = parseInt(form.querySelector('[id$="totalPlots"]').value) || 0;
            const sold = parseInt(form.querySelector('[id$="soldPlots"]').value) || 0;
            form.querySelector('[id$="remainingPlots"]').value = calculateRemainingPlots(total, sold);
          });
        });

        document.getElementById('propertyForm').addEventListener('submit', async (e) => {
          e.preventDefault();

          const propertyName = document.getElementById('propertyName').value;
          const location = document.getElementById('location').value;
          const totalPlots = parseInt(document.getElementById('totalPlots').value);
          const soldPlots = parseInt(document.getElementById('soldPlots').value);
          const remainingPlots = calculateRemainingPlots(totalPlots, soldPlots);
          const description = document.getElementById('description').value;
          const file = document.getElementById('imageUpload').files[0];

          if (!file) {
            alert("Please choose an image to upload first.");
            return;
          }

          // Disable the submit button to prevent multiple submissions
          const submitButton = document.querySelector('#propertyForm button[type="submit"]');
          submitButton.disabled = true;

          try {
            const storageRef = ref(storage, 'images/' + file.name);
            const uploadTask = uploadBytesResumable(storageRef, file);

            uploadTask.on('state_changed',
              null, // No progress handler
              (error) => {
                console.error('Upload failed:', error);
                // Re-enable the submit button on error
                submitButton.disabled = false;
              },
              async () => {
                const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
                await addDoc(collection(firestore, 'PropertyImage'), {
                  propertyName,
                  location,
                  totalPlots,
                  soldPlots,
                  remainingPlots,
                  description,
                  imageUrl: downloadURL,
                  imageName: file.name
                });

                // Show success message
                showToast();
                // Load images to refresh the table
                loadImages();
                // Clear the form
                document.getElementById('propertyForm').reset();
                // Re-enable the submit button
                submitButton.disabled = false;
                // Close the modal
                const addModal = bootstrap.Modal.getInstance(document.getElementById('addPropertyModal'));
                addModal.hide();
              }
            );
          } catch (error) {
            console.error('Error uploading file:', error);
            // Re-enable the submit button on error
            submitButton.disabled = false;
          }
        });

        const loadImages = async () => {
          const imageTable = document.getElementById('imageTableBody');
          imageTable.innerHTML = '';

          try {
            const querySnapshot = await getDocs(collection(firestore, 'PropertyImage'));
            querySnapshot.forEach((doc) => {
              const property = doc.data();
              const row = document.createElement('tr');
              row.innerHTML = `
                <td><img src="${property.imageUrl}" class="img-fluid" width="100" alt="${property.propertyName}" /></td>
                <td>${property.propertyName}</td>
                <td>${property.location}</td>
                <td>${property.totalPlots}</td>
                <td>${property.soldPlots}</td>
                <td>${property.remainingPlots}</td>
                <td><button class="btn btn-primary btn-sm" onclick="editImage('${property.imageName}', '${property.imageUrl}', '${doc.id}', '${property.propertyName}', '${property.location}', ${property.totalPlots}, ${property.soldPlots}, ${property.remainingPlots}, '${property.description}')">Edit</button></td>
                <td><button class="btn btn-danger btn-sm" onclick="deleteImage('${property.imageName}', '${doc.id}')">Delete</button></td>`;
              imageTable.appendChild(row);
            });
          } catch (error) {
            console.error('Error loading images:', error);
          }
        };

        window.editImage = (imageName, url, docId, propertyName, location, totalPlots, soldPlots, remainingPlots, description) => {
          document.getElementById('editPropertyName').value = propertyName;
          document.getElementById('editLocation').value = location;
          document.getElementById('editTotalPlots').value = totalPlots;
          document.getElementById('editSoldPlots').value = soldPlots;
          document.getElementById('editRemainingPlots').value = remainingPlots;
          document.getElementById('editDescription').value = description;
          document.getElementById('editImagePreview').src = url;
          document.getElementById('editForm').setAttribute('data-doc-id', docId);
          document.getElementById('editForm').setAttribute('data-image-name', imageName);
          
          const editModal = new bootstrap.Modal(document.getElementById('editModal'));
          editModal.show();
        };

        document.getElementById('editForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const docId = e.target.getAttribute('data-doc-id');
          const totalPlots = parseInt(document.getElementById('editTotalPlots').value);
          const soldPlots = parseInt(document.getElementById('editSoldPlots').value);
          const remainingPlots = calculateRemainingPlots(totalPlots, soldPlots);
          
          await updateDoc(doc(firestore, 'PropertyImage', docId), {
            propertyName: document.getElementById('editPropertyName').value,
            location: document.getElementById('editLocation').value,
            totalPlots: totalPlots,
            soldPlots: soldPlots,
            remainingPlots: remainingPlots,
            description: document.getElementById('editDescription').value
          });
          loadImages();
          const editModal = bootstrap.Modal.getInstance(document.getElementById('editModal'));
          editModal.hide();
        });

        window.deleteImage = async (imageName, docId) => {
          if (confirm('Are you sure you want to delete this property?')) {
            const desertRef = ref(storage, 'images/' + imageName);
            try {
              await deleteObject(desertRef);
              await deleteDoc(doc(firestore, 'PropertyImage', docId));
              loadImages();
            } catch (error) {
              console.error('Error removing file:', error);
            }
          }
        };

        const showToast = () => {
          const toastEl = document.getElementById('toast');
          const toast = new bootstrap.Toast(toastEl);
          toast.show();
        };

        loadImages();

        document.getElementById('logoutButton').addEventListener('click', () => {
          signOut(auth).then(() => {
            window.location.href = 'login.html'; // Redirect to login page
          }).catch((error) => {
            console.error('Error signing out:', error);
          });
        });
      });
    });
  </script>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Radha Realty Admin</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <button class="btn btn-outline-light" id="logoutButton">Logout</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Uploaded Properties</h2>
      <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPropertyModal">
        Add Property
      </button>
    </div>
    <div class="table-responsive">
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Image</th>
            <th>Property Name</th>
            <th>Location</th>
            <th>Total Plots</th>
            <th>Sold Plots</th>
            <th>Remaining Plots</th>
            <th>Edit</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody id="imageTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Add Property Modal -->
  <div class="modal fade" id="addPropertyModal" tabindex="-1" aria-labelledby="addPropertyModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="addPropertyModalLabel">Add Property</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="propertyForm" enctype="multipart/form-data">
            <div class="mb-3">
              <label for="propertyName" class="form-label">Property Name</label>
              <input type="text" class="form-control" id="propertyName" required>
            </div>
            <div class="mb-3">
              <label for="location" class="form-label">Location</label>
              <input type="text" class="form-control" id="location" required>
            </div>
            <div class="mb-3">
              <label for="totalPlots" class="form-label">Total Plots</label>
              <input type="number" class="form-control" id="totalPlots" required>
            </div>
            <div class="mb-3">
              
              <label for="soldPlots" class="form-label">Sold Plots</label>
              <input type="number" class="form-control" id="soldPlots" required>
            </div>
            <div class="mb-3">
              <label for="remainingPlots" class="form-label">Remaining Plots</label>
              <input type="number" class="form-control" id="remainingPlots" readonly>
            </div>
            <div class="mb-3">
              <label for="description" class="form-label">About Project</label>
              <textarea class="form-control" id="description" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label for="imageUpload" class="form-label">Property Image</label>
              <input type="file" class="form-control" id="imageUpload" required accept="image/*">
            </div>
            <button type="submit" class="btn btn-primary">Add Property</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editModalLabel">Edit Property</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="editForm">
            <div class="mb-3">
              <img id="editImagePreview" src="" alt="Property Image" class="img-fluid mb-3" />
            </div>
            <div class="mb-3">
              <label for="editPropertyName" class="form-label">Property Name</label>
              <input type="text" class="form-control" id="editPropertyName" required>
            </div>
            <div class="mb-3">
              <label for="editLocation" class="form-label">Location</label>
              <input type="text" class="form-control" id="editLocation" required>
            </div>
            <div class="mb-3">
              <label for="editTotalPlots" class="form-label">Total Plots</label>
              <input type="number" class="form-control" id="editTotalPlots" required>
            </div>
            <div class="mb-3">
              <label for="editSoldPlots" class="form-label">Sold Plots</label>
              <input type="number" class="form-control" id="editSoldPlots" required>
            </div>
            <div class="mb-3">
              <label for="editRemainingPlots" class="form-label">Remaining Plots</label>
              <input type="number" class="form-control" id="editRemainingPlots" readonly>
            </div>
            <div class="mb-3">
              <label for="editDescription" class="form-label">About Project</label>
              <textarea class="form-control" id="editDescription" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Update Property</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <strong class="me-auto">Success</strong>
      <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
    <div class="toast-body">
      Property added successfully!
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>

</html>
