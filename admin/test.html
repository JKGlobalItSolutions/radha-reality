<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Upload Form</title>
    <!-- Bootstrap CSS -->
    <link 
        rel="stylesheet" 
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" 
        integrity="sha384-DyZv7gFqCtODq1qZ4QuLmT6rf1E7H7H73dP7X5G4EK4j0r7wiH4aLBYgLfTkA2aR" 
        crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Upload Property</h1>
        <form id="uploadForm" class="mt-4">
            <div class="form-group">
                <label for="propertyName">Property Name:</label>
                <input 
                    type="text" 
                    class="form-control" 
                    id="propertyName" 
                    placeholder="Enter property name" 
                    required>
            </div>
            <div class="form-group">
                <label for="imageUpload">Upload Image:</label>
                <input 
                    type="file" 
                    class="form-control-file" 
                    id="imageUpload" 
                    accept="image/*" 
                    required>
            </div>
            <div id="errorMessage" class="text-danger"></div>
            <button 
                type="submit" 
                class="btn btn-primary">
                Submit
            </button>
        </form>
    </div>

    <!-- Firebase Configuration -->
    <script src="https://www.gstatic.com/firebasejs/9.14.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.14.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.14.0/firebase-storage.js"></script>
    <script>
        // Your Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA0QZ3-v29eEelAfhlha5RHJZBuJ6mekes",
            authDomain: "radha-realty-99472.firebaseapp.com",
            projectId: "radha-realty-99472",
            storageBucket: "radha-realty-99472.appspot.com",
            messagingSenderId: "125909486002",
            appId: "1:125909486002:web:bbcdefb22a1922ea843cab",
            measurementId: "G-JNV02788XZ"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        // Handle form submission
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent page reload
            
            const propertyName = document.getElementById('propertyName').value;
            const imageFile = document.getElementById('imageUpload').files[0];
            const errorMessage = document.getElementById('errorMessage');

            errorMessage.textContent = '';

            if (!propertyName || !imageFile) {
                errorMessage.textContent = 'Both fields are required';
                return;
            }

            try {
                // Upload image to Firebase Storage
                const imageRef = storage.ref(`images/${imageFile.name}`);
                await imageRef.put(imageFile);
                const imageUrl = await imageRef.getDownloadURL();

                // Store data in Firestore
                await db.collection('properties').add({
                    propertyName,
                    imageUrl,
                });

                // Reset form fields
                document.getElementById('uploadForm').reset();
                alert('Property uploaded successfully!');
            } catch (error) {
                console.error("Error uploading file:", error);
                errorMessage.textContent = 'Error uploading file';
            }
        });
    </script>
</body>
</html>
