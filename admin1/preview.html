<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Estate Admin - Preview Images</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: white;
      color: #292929;
    }
  </style>
</head>
<body>

<div class="container py-5">
  <h3 class="text-center mb-4">Property Image Previews</h3>
  <div id="imagePreview" class="row row-cols-lg-3 row-cols-md-2 row-cols-sm-1 row-cols-1"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js"></script>

<script>
  // Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyA0QZ3-v29eEelAfhlha5RHJZBuJ6mekes",
    authDomain: "radha-realty-99472.firebaseapp.com",
    projectId: "radha-realty-99472",
    storageBucket: "radha-realty-99472.appspot.com",
    messagingSenderId: "125909486002",
    appId: "1:125909486002:web:bbcdefb22a1922ea843cab",
    measurementId: "G-JNV02788XZ"
  };

  const app = firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // Fetch and display images
  db.collection('properties').get().then((querySnapshot) => {
    querySnapshot.forEach((doc) => {
      const data = doc.data();
      displayImagePreview(data.imageURL, data.propertyName);
    });
  });

  // Display image preview
  function displayImagePreview(imageURL, propertyName) {
    const imagePreview = `
      <div class="col pb-6">
        <div class="card">
          <img src="${imageURL}" class="card-img-top" alt="${propertyName}">
        </div>
      </div>
    `;
    document.getElementById('imagePreview').innerHTML += imagePreview;
  }
</script>

</body>
</html>
