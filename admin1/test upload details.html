<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Estate Admin - Upload Property</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: white;
      color: #292929;
    }
    .card-header {
      background-color: green;
      color: white;
    }
    .btn-primary {
      background-color: green;
      border-color: green;
    }
    .progress {
      display: none;
    }
  </style>
</head>
<body>

<div class="container py-5">
  <h3 class="text-center mb-4">Upload Property Details</h3>
  <form id="propertyForm" enctype="multipart/form-data">
    <div class="mb-3">
      <label for="propertyName" class="form-label">Property Name</label>
      <input type="text" class="form-control" id="propertyName" placeholder="Enter property name" required>
    </div>
    <div class="mb-3">
      <label for="location" class="form-label">Location</label>
      <input type="text" class="form-control" id="location" placeholder="Enter location" required>
    </div>
    <div class="mb-3">
      <label for="totalPlots" class="form-label">Total Plots</label>
      <input type="number" class="form-control" id="totalPlots" placeholder="Enter total plots" required>
    </div>
    <div class="mb-3">
      <label for="soldPlots" class="form-label">Sold Plots</label>
      <input type="number" class="form-control" id="soldPlots" placeholder="Enter sold plots" required>
    </div>
    <div class="mb-3">
      <label for="remainingPlots" class="form-label">Remaining Plots</label>
      <input type="number" class="form-control" id="remainingPlots" placeholder="Enter remaining plots" required>
    </div>
    <div class="mb-3">
      <label for="imageUpload" class="form-label">Property Image</label>
      <input type="file" class="form-control" id="imageUpload" accept="image/*" required>
    </div>
    <button type="submit" class="btn btn-primary" id="submitBtn">Submit</button>
    <div class="progress mt-2">
      <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
    </div>
  </form>

  <div class="mt-5">
    <h4 class="text-center">Preview</h4>
    <div id="cardPreview" class="row row-cols-lg-3 row-cols-md-2 row-cols-sm-1 row-cols-1"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-storage.js"></script>

<script>
  // Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyA0QZ3-v29eEelAfhlha5RHJZBuJ6mekes",
    authDomain: "radha-realty-99472.firebaseapp.com",
    projectId: "radha-realty-99472",
    storageBucket: "radha-realty-99472.appspot.com",
    messagingSenderId: "125909486002",
    appId: "1:125909486002:web:bbcdefb22a1922ea843cab",
    measurementId: "G-JNV02788XZ"
  };

  // Initialize Firebase
  const app = firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const storage = firebase.storage();

  // Form submission handler
  document.getElementById('propertyForm').addEventListener('submit', function (e) {
    e.preventDefault();  // Prevent page reload

    const propertyName = document.getElementById('propertyName').value;
    const location = document.getElementById('location').value;
    const totalPlots = document.getElementById('totalPlots').value;
    const soldPlots = document.getElementById('soldPlots').value;
    const remainingPlots = document.getElementById('remainingPlots').value;
    const imageFile = document.getElementById('imageUpload').files[0];

    if (!imageFile) {
      alert("Please upload an image");
      return;
    }

    // Disable the button while uploading
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = "Uploading...";

    const progressBar = document.getElementById('progressBar');
    const progressContainer = document.querySelector('.progress');
    progressContainer.style.display = "block";

    // Upload image to Firebase Storage
    const storageRef = storage.ref(`properties/${imageFile.name}`);
    const uploadTask = storageRef.put(imageFile);

    // Monitor upload progress
    uploadTask.on('state_changed', 
      (snapshot) => {
        const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
        progressBar.style.width = progress + "%";
        progressBar.innerText = Math.round(progress) + "%";
      }, 
      (error) => {
        console.error('Upload failed:', error);
        alert('Error uploading property details.');
        resetForm();
      }, 
      () => {
        uploadTask.snapshot.ref.getDownloadURL().then((downloadURL) => {
          // Store property data in Firestore
          return db.collection('properties').add({
            propertyName,
            location,
            totalPlots: parseInt(totalPlots),
            soldPlots: parseInt(soldPlots),
            remainingPlots: parseInt(remainingPlots),
            imageURL: downloadURL
          });
        }).then(() => {
          alert('Property details uploaded successfully!');
          displayCardPreview(propertyName, location, totalPlots, soldPlots, remainingPlots, imageFile.name);
          resetForm();
        }).catch((error) => {
          console.error('Error uploading property details:', error);
          alert('Error uploading property details.');
          resetForm();
        });
      }
    );
  });

  // Reset the form and progress after submission
  function resetForm() {
    document.getElementById('propertyForm').reset();
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('submitBtn').innerText = "Submit";
    document.getElementById('progressBar').style.width = "0%";
    document.querySelector('.progress').style.display = "none";
  }

  // Display card preview
  function displayCardPreview(name, location, total, sold, remaining, imageURL) {
    const cardPreview = `
      <div class="col pb-6">
        <div class="card">
          <img src="${imageURL}" class="card-img-top" alt="${name}">
          <div class="card-body">
            <h5 class="card-title">${name}</h5>
            <p class="card-text">${location}</p>
            <ul class="list-inline">
              <li class="list-inline-item">Total Plots: ${total}</li>
              <li class="list-inline-item">Sold: ${sold}</li>
              <li class="list-inline-item">Remaining: ${remaining}</li>
            </ul>
          </div>
        </div>
      </div>
    `;
    document.getElementById('cardPreview').innerHTML += cardPreview;
  }
</script>

</body>
</html>
